## publishable areas
"area: core":
  - changed-files:
      - any-glob-to-any-file: "bamboozle/**"

## non-publishable areas
"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - ".assets/**"
          - "README.md"
          - "llms.txt"
          - "LICENSE-APACHE"
          - "LICENSE-MIT"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          - "tests/**"
          - "examples/**"